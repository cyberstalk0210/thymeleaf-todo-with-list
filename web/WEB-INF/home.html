<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Google Fonts (optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <title>Todo List</title>
</head>
<body class="bg-dark">

<div class="container py-5">
    <header class="text-center text-light mb-4">
        <h1 class="mb-3">My To-Do List</h1>

        <!-- Search form -->
        <form class="search" method="get" th:action="@{/todos/search}">
            <input class="form-control m-auto w-50"
                   type="text"
                   name="keyword"
                   placeholder="Search todos..." />
        </form>
    </header>

    <!-- Display Todos Table -->
    <table class="table table-bordered table-hover w-75 m-auto text-center align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Priority</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="todo : ${todos}">
            <td th:text="${todo.id}"></td>
            <td th:text="${todo.title}"></td>
            <td th:text="${todo.priority}"></td>
            <td th:text="${#temporals.format(todo.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
            <td>
                <a th:href="@{/todos/edit/{id}(id=${todo.id})}" class="btn btn-sm btn-warning me-2">Edit</a>
                <form th:action="@{/todos/delete/{id}(id=${todo.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Add validation or no todos found message -->
    <div th:if="${#lists.isEmpty(todos)}" class="alert alert-warning text-center">
        No todos found.
    </div>
    <div>
        <a href="/todos/add" class="btn btn-secondary">ADD Todo</a>
    </div>

</div>

</body>
</html>
